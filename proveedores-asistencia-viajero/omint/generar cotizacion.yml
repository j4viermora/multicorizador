info:
  name: generar cotizacion
  type: http
  seq: 2

http:
  method: POST
  url: https://oaapp.eastus2.cloudapp.azure.com:8448/Quotation/CreateQuotationB2B
  headers:
    - name: Authorization
      value: Bearer {{omint_access_token}}
  body:
    type: json
    data: |-
      {
        "agreementNumber": "3329",
        "departureCode": "ARG",
        "destinationCode": "MUN",
        "dateSince": "2026-10-10",
        "dateUntil": "2026-11-10",
        "passengerAges": [25],
        "email": "cliente@example.com",
        "name": "Cliente Ejemplo",
        "phoneNumber": "+541112345678"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
