info:
  name: get token
  type: http
  seq: 1

http:
  method: POST
  url: https://core.omintassistance.com.ar/connect/token
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: client_credentials
      - name: client_id
        value: "{{omint_client_id}}"
      - name: client_secret
        value: "{{omint_client_secret}}"
      - name: scope
        value: OACoreApi IntegrationWebApi
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
